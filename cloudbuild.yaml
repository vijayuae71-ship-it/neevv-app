# neevv — Cloud Build CI/CD Pipeline
# Triggered automatically on push to main branch
# Sends build errors to webhook for automated debugging

steps:
  # Step 1: Build the Docker image (with error capture)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build -t gcr.io/$PROJECT_ID/neevv-app:$COMMIT_SHA -t gcr.io/$PROJECT_ID/neevv-app:latest . 2>&1 | tee /workspace/build.log
        BUILD_EXIT=$${PIPESTATUS[0]}
        if [ $$BUILD_EXIT -ne 0 ]; then
          echo "=== BUILD FAILED — sending logs to webhook ==="
          LOGS=$$(tail -80 /workspace/build.log | sed 's/"/\\"/g' | awk '{printf "%s\\n", $$0}')
          [ -n "${_BUILD_WEBHOOK_URL}" ] && curl -s -X POST "${_BUILD_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d "{\"status\": \"FAILED\", \"step\": \"docker_build\", \"build_id\": \"$BUILD_ID\", \"commit\": \"$COMMIT_SHA\", \"logs\": \"$$LOGS\"}"
          exit 1
        fi
        echo "=== BUILD SUCCESS ==="

  # Step 2: Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/neevv-app:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/neevv-app:latest']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'neevv-app'
      - '--image'
      - 'gcr.io/$PROJECT_ID/neevv-app:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'NODE_ENV=production,GEMINI_API_KEY=${_GEMINI_API_KEY},ANTHROPIC_API_KEY=${_ANTHROPIC_API_KEY},GCS_BUCKET_NAME=neevv-renders,GCP_PROJECT_ID=$PROJECT_ID'

  # Step 4: Deploy Firebase Hosting (clean URL → Cloud Run)
  - name: 'node:18'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g firebase-tools
        firebase deploy --only hosting --project $PROJECT_ID --non-interactive

  # Step 5: Notify success (webhook URL comes from the trigger's _BUILD_WEBHOOK_URL substitution; skipped when unset)
  - name: 'gcr.io/cloud-builders/curl'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -n "${_BUILD_WEBHOOK_URL}" ]; then
          curl -s -X POST "${_BUILD_WEBHOOK_URL}" -H "Content-Type: application/json" \
            -d '{"status": "SUCCESS", "step": "deploy", "build_id": "'"$BUILD_ID"'", "commit": "'"$COMMIT_SHA"'"}'
        fi

substitutions:
  # Set both in the Cloud Build trigger (never commit their values):
  _GEMINI_API_KEY: ''
  _ANTHROPIC_API_KEY: ''
  _BUILD_WEBHOOK_URL: ''

images:
  - 'gcr.io/$PROJECT_ID/neevv-app:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/neevv-app:latest'

options:
  logging: CLOUD_LOGGING_ONLY
